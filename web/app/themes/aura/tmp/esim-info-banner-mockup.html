<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM Info Banner Mockup</title>
    <style>
        :root {
            --page-bg: #edf1f5;
            --surface: #ffffff;
            --text: #15171c;
            --muted: #5f6673;
            --line: #d9e3ec;
            --info-bg: linear-gradient(135deg, #eef7ff 0%, #f7fbff 100%);
            --info-border: #cfe0f1;
            --info-text: #31597d;
            --info-icon-bg: #dceeff;
            --info-icon-fg: #1f5b92;
            --shadow: 0 18px 40px rgba(21, 23, 28, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 212, 71, 0.18), transparent 22%),
                radial-gradient(circle at top right, rgba(130, 185, 245, 0.12), transparent 20%),
                var(--page-bg);
            color: var(--text);
            padding: 56px 24px;
        }

        .frame {
            max-width: 1080px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 28px;
        }

        .hero__title {
            margin: 0;
            font-size: 46px;
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .hero__crumbs {
            margin-top: 12px;
            color: var(--muted);
            font-size: 15px;
        }

        .info-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            margin: 0 auto 28px;
            border: 1px solid var(--info-border);
            border-radius: 18px;
            background: var(--info-bg);
            color: var(--info-text);
            box-shadow: 0 10px 30px rgba(49, 89, 125, 0.08);
            backdrop-filter: blur(10px);
        }

        .info-banner__icon {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: var(--info-icon-bg);
            color: var(--info-icon-fg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .info-banner__content {
            flex: 1;
            min-width: 0;
        }

        .info-banner__label {
            display: block;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.72;
            margin-bottom: 3px;
            font-weight: 700;
        }

        .info-banner__text {
            font-size: 15px;
            line-height: 1.45;
            font-weight: 600;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 24px;
            min-height: 220px;
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: auto -30px -45px auto;
            width: 140px;
            height: 140px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255, 204, 41, 0.18), transparent 70%);
            pointer-events: none;
        }

        .card__country {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.03em;
            margin-bottom: 18px;
        }

        .card__title {
            margin: 0 0 10px;
            font-size: 34px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .card__meta {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .meter {
            height: 10px;
            background: #edf1f5;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .meter>span {
            display: block;
            width: 64%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ffc319 0%, #a5d300 100%);
        }

        .card__foot {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 820px) {
            .hero__title {
                font-size: 34px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .info-banner {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <main class="frame">
        <header class="hero">
            <h1 class="hero__title">All eSIMs</h1>
            <div class="hero__crumbs">Dashboard &nbsp;&rsaquo;&nbsp; My eSIMs &nbsp;&rsaquo;&nbsp; All</div>
        </header>

        <section class="info-banner" aria-label="Usage refresh information">
            <div class="info-banner__icon">i</div>
            <div class="info-banner__content">
                <span class="info-banner__label">Usage Refresh</span>
                <div class="info-banner__text">Data usage across all eSIMs is updated every 5 minutes.</div>
            </div>
        </section>

        <section class="cards" aria-label="eSIM cards">
            <article class="card">
                <div class="card__country">PHILIPPINES</div>
                <h2 class="card__title">PH 1GB 7 Days</h2>
                <div class="card__meta">0.00 KB of 2 GB used</div>
                <div class="meter"><span></span></div>
                <div class="card__foot">
                    <span>179 days left</span>
                    <span>Active</span>
                </div>
            </article>

            <article class="card">
                <div class="card__country">CHINA</div>
                <h2 class="card__title">CN 1GB 7 Days</h2>
                <div class="card__meta">0.00 KB of 1 GB used</div>
                <div class="meter"><span style="width: 0%"></span></div>
                <div class="card__foot">
                    <span>Expired</span>
                    <span>Explore new options</span>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
