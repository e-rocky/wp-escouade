<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Leaflet Example</title>

    <!-- Inclure Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        /* Style pour que la carte occupe toute la fenêtre */
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- Div pour afficher la carte -->
    <div id="map"></div>

    <!-- Inclure Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        // Initialisation de la carte
        var map = L.map('map').setView([48.8566, 2.3522], 13);  // Centrer la carte sur Paris avec un zoom de 13

        // Ajouter un fond de carte (tile layer)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Ajouter un marqueur sur la carte
        var marker = L.marker([48.8566, 2.3522]).addTo(map);

        // Ajouter un popup au marqueur
        marker.bindPopup("<b>Paris</b><br>La capitale de la France").openPopup();

        // Ajouter un cercle autour de Paris
        var circle = L.circle([-18.913084055358038, 47.5430931641316], {
            color: 'blue',
            fillColor: '#30f',
            fillOpacity: 0.2,
            radius: 5000
        }).addTo(map);

        // Ajouter une zone polygonale (par exemple, un carré autour de Paris)
        var polygon = L.polygon([
            [48.8606, 2.3510],
            [48.8606, 2.3550],
            [48.8586, 2.3550],
            [48.8586, 2.3510]
        ]).addTo(map);

        // Ajouter des événements (ex: clic sur la carte)
        map.on('click', function (e) {
            alert("Vous avez cliqué sur la carte à " + e.latlng);
        });
    </script>

</body>

</html>
